name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          # Hosted runners can fail DNS for Ubuntu's primary archive domains.
          # Keep Ubuntu package signatures and the mandatory sandbox probe.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          timeout 180s sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          timeout 120s sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install --yes bubblewrap
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl --write kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /bin/true

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock

      - name: Verify Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from talos import sandbox

          backend = sandbox.select_backend(sandbox.default_backends())
          assert backend is not None and backend.name == "bubblewrap", backend
          print("bubblewrap backend is active")
          PY

      - name: Check public hygiene
        run: python scripts/check-public-hygiene.py

      - name: Check FAQ search metadata and links
        run: python scripts/check-site-discovery.py

      - name: Run offline proof demonstrations
        run: python scripts/demo-proof.py

      - name: Verify embedded signature-verifier pins
        run: python scripts/sync-verifier-lock.py --check

      - name: Test release qualification tooling
        run: python -m pytest scripts/tests/ -q

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Run adversarial suite
        run: python redteam.py

      - name: Test desktop boundaries
        if: runner.os == 'macOS'
        run: python -m pytest macos/Tests -q

      - name: Set up pinned app build tool
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.12'

      - name: Build and verify the macOS preview from source
        if: runner.os == 'macOS'
        run: |
          uv python install cpython-3.13.12-macos-aarch64-none --no-bin
          python macos/build_app.py --python-root "$(uv python dir)/cpython-3.13.12-macos-aarch64-none" --out "$RUNNER_TEMP/Talos.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Talos.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/Talos.app" "$RUNNER_TEMP/Talos-macOS-preview.zip"

      - name: Keep the verified preview (not notarized)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Talos-macOS-preview
          path: ${{ runner.temp }}/Talos-macOS-preview.zip
          retention-days: 7
          if-no-files-found: error
