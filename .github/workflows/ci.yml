name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if sysctl kernel.unprivileged_userns_clone >/dev/null 2>&1; then
            sudo sysctl --write kernel.unprivileged_userns_clone=1
          fi
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-all --ro-bind / / -- /bin/true

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock

      - name: Verify Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          from talos import sandbox

          backend = sandbox.select_backend(sandbox.default_backends())
          assert backend is not None and backend.name == "bubblewrap", backend
          print("bubblewrap backend is active")
          PY

      - name: Check public hygiene
        run: python scripts/check-public-hygiene.py

      - name: Verify embedded signature-verifier pins
        run: python scripts/sync-verifier-lock.py --check

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Run adversarial suite
        run: python redteam.py

      - name: Test desktop boundaries
        if: runner.os == 'macOS'
        run: python -m pytest macos/Tests -q

      - name: Set up pinned app build tool
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.12'

      - name: Build and verify the macOS preview from source
        if: runner.os == 'macOS'
        run: |
          uv python install cpython-3.13.12-macos-aarch64-none --no-bin
          python macos/build_app.py --python-root "$(uv python dir)/cpython-3.13.12-macos-aarch64-none" --out "$RUNNER_TEMP/Talos.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/Talos.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/Talos.app" "$RUNNER_TEMP/Talos-macOS-preview.zip"

      - name: Keep the verified preview (not notarized)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Talos-macOS-preview
          path: ${{ runner.temp }}/Talos-macOS-preview.zip
          retention-days: 7
          if-no-files-found: error
